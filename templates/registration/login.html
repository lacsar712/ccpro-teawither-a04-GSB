{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>茶萎凋台账</h1>
  <p class="muted" style="text-align:center">请登录后管理茶园与萎凋槽</p>
  {% if form.errors %}
  <ul class="messages"><li class="error">用户名或密码不正确</li></ul>
  {% endif %}
  <form method="post" class="form-grid">
    {% csrf_token %}
    <div class="form-row">
      <label for="id_username">用户名</label>
      <input class="input" type="text" name="username" id="id_username" autofocus required>
    </div>
    <div class="form-row">
      <label for="id_password">密码</label>
      <input class="input" type="password" name="password" id="id_password" required>
    </div>
    <button class="btn" type="submit">登录</button>
  </form>
</div>
{% endblock %}
